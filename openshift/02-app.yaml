apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-flask-app
  labels:
    app: oom-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-flask-app
  template:
    metadata:
      labels:
        app: oom-flask-app
    spec:
      containers:
        - name: app
          image: stefanbudim/oom-flask-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: HOST
              value: "0.0.0.0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # Hard limit triggers cgroup OOM killer (exit code 137) when breached!
            limits:
              memory: "256Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oom-flask-app
  labels:
    app: oom-flask-app
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app: oom-flask-app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: oom-flask-app
  labels:
    app: oom-flask-app
spec:
  to:
    kind: Service
    name: oom-flask-app
  port:
    targetPort: http
